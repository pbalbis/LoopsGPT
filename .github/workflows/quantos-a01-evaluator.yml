name: QuantOS A01 Evaluator

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'evaluator.py'
      - 'run_a01.py'
      - 'config/**'
      - '.github/workflows/quantos-a01-evaluator.yml'
  schedule:
    - cron: '27 * * * *'

permissions:
  contents: write

concurrency:
  group: quantos-state
  cancel-in-progress: false

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Restore latest XAUUSD dataset cache
        uses: actions/cache/restore@v4
        with:
          path: |
            data/raw
            .cache/dukascopy
          key: quantos-xauusd-v2-${{ github.run_id }}
          restore-keys: |
            quantos-xauusd-v2-

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install evaluator
        run: python -m pip install -e .

      - name: Verify dataset availability
        shell: bash
        run: |
          test -f data/raw/XAUUSD15.csv.gz
          test -f data/manifest.json

      - name: Execute deterministic A01 evaluation
        run: python run_a01.py

      - name: Commit evaluator evidence
        shell: bash
        run: |
          git config user.name 'quantos-bot'
          git config user.email 'quantos-bot@users.noreply.github.com'
          git add state artifacts
          if git diff --cached --quiet; then exit 0; fi
          git commit -m '[quantos] deterministic A01 evaluation'
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Publish experiment evidence
        uses: actions/upload-artifact@v4
        with:
          name: quantos-a01-${{ github.run_id }}
          path: |
            artifacts/latest_run.json
            artifacts/experiments/**
          if-no-files-found: error
          retention-days: 30
