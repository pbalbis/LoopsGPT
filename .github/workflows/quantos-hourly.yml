name: QuantOS Hourly Evaluator

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/bootstrap_data.mjs'
      - 'scripts/restore_seed.mjs'
      - 'package.json'
      - 'evaluator.py'
      - 'run_a01.py'
      - 'pyproject.toml'
      - 'config/**'
      - '.github/workflows/quantos-hourly.yml'

permissions:
  contents: write

concurrency:
  group: quantos-state
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NODE_OPTIONS: --dns-result-order=ipv4first
    steps:
      - uses: actions/checkout@v4

      - name: Resolve UTC cache day
        id: utc
        shell: bash
        run: echo "day=$(date -u +%F)" >> "$GITHUB_OUTPUT"

      - name: Restore daily market-data cache
        id: market-cache
        uses: actions/cache@v4
        with:
          path: |
            data/raw
            .cache/dukascopy
          key: quantos-xauusd-v2-${{ steps.utc.outputs.day }}
          restore-keys: |
            quantos-xauusd-v2-

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pinned market-data client
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Restore deterministic seed when available
        if: hashFiles('data/seed/XAUUSD15.seed.br.b64.part-*') != ''
        run: |
          if [ ! -f data/raw/XAUUSD15.csv.gz ]; then node scripts/restore_seed.mjs; fi

      - name: Bootstrap and increment XAUUSD data
        id: bootstrap
        continue-on-error: true
        shell: bash
        env:
          QUANTOS_M15_START: '2022-04-26T00:00:00.000Z'
          QUANTOS_M1_START: '2026-04-07T00:00:00.000Z'
        run: |
          mkdir -p artifacts
          set +e
          npm run data:bootstrap > artifacts/data_bootstrap.full.log 2>&1
          code=$?
          tail -n 200 artifacts/data_bootstrap.full.log > artifacts/data_bootstrap.log
          rm -f artifacts/data_bootstrap.full.log
          exit "$code"

      - name: Record data-pipeline heartbeat
        if: always()
        shell: bash
        run: |
          mkdir -p artifacts
          cat > artifacts/data_pipeline_status.json <<EOF
          {
            "workflow_run_id": "${{ github.run_id }}",
            "head_sha": "${{ github.sha }}",
            "event": "${{ github.event_name }}",
            "bootstrap_outcome": "${{ steps.bootstrap.outcome }}",
            "cache_hit": "${{ steps.market-cache.outputs.cache-hit }}",
            "utc_day": "${{ steps.utc.outputs.day }}",
            "recorded_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF

      - name: Publish daily reproducibility artifact
        if: steps.bootstrap.outcome == 'success' && steps.market-cache.outputs.cache-hit != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: quantos-xauusd-${{ steps.utc.outputs.day }}
          path: |
            data/raw/XAUUSD15.csv.gz
            data/raw/XAUUSD1.csv.gz
            data/manifest.json
          if-no-files-found: warn
          retention-days: 14
          compression-level: 0

      - uses: actions/setup-python@v5
        if: steps.bootstrap.outcome == 'success'
        with:
          python-version: '3.11'
          cache: pip

      - name: Install QuantOS evaluator
        if: steps.bootstrap.outcome == 'success'
        run: python -m pip install -e .

      - name: Execute deterministic A01 evaluation
        if: steps.bootstrap.outcome == 'success'
        run: python run_a01.py

      - name: Commit reproducible state and evidence
        if: always()
        shell: bash
        run: |
          git config user.name 'quantos-bot'
          git config user.email 'quantos-bot@users.noreply.github.com'
          git add state artifacts
          if [ -f data/manifest.json ]; then git add data/manifest.json; fi
          if git diff --cached --quiet; then exit 0; fi
          git commit -m '[quantos] deterministic A01 evaluation'
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Publish evaluation evidence
        if: steps.bootstrap.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: quantos-a01-${{ github.run_id }}
          path: |
            artifacts/latest_run.json
            artifacts/experiments/**
          if-no-files-found: error
          retention-days: 30

      - name: Fail closed when data bootstrap fails
        if: steps.bootstrap.outcome != 'success'
        run: exit 1
