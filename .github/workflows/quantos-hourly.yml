name: QuantOS Hourly Micro-Job

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: quantos-state
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -e .
      - name: Execute one atomic job
        run: python quantos.py run
      - name: Commit state delta
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'quantos-bot'
          git config user.email 'quantos-bot@users.noreply.github.com'
          git add state artifacts
          git commit -m '[quantos] atomic research delta'
          git push
