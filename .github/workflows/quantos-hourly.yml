name: QuantOS Hourly Micro-Job

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/bootstrap_data.mjs'
      - 'package.json'
      - 'quantos.py'
      - 'config/**'
      - '.github/workflows/quantos-hourly.yml'

permissions:
  contents: write

concurrency:
  group: quantos-state
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Resolve UTC cache day
        id: utc
        shell: bash
        run: echo "day=$(date -u +%F)" >> "$GITHUB_OUTPUT"

      - name: Restore daily market-data cache
        id: market-cache
        uses: actions/cache@v4
        with:
          path: |
            data/raw
            .cache/dukascopy
          key: quantos-xauusd-v1-${{ steps.utc.outputs.day }}
          restore-keys: |
            quantos-xauusd-v1-

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pinned market-data client
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Bootstrap and increment XAUUSD data
        env:
          QUANTOS_M15_START: '2022-04-26T00:00:00.000Z'
          QUANTOS_M1_START: '2026-04-07T00:00:00.000Z'
        run: npm run data:bootstrap

      - name: Publish daily reproducibility artifact
        if: steps.market-cache.outputs.cache-hit != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: quantos-xauusd-${{ steps.utc.outputs.day }}
          path: |
            data/raw/XAUUSD15.csv.gz
            data/raw/XAUUSD1.csv.gz
            data/manifest.json
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install QuantOS
        run: python -m pip install -e .

      - name: Execute one atomic job
        run: python quantos.py run

      - name: Commit reproducible state delta
        shell: bash
        run: |
          git config user.name 'quantos-bot'
          git config user.email 'quantos-bot@users.noreply.github.com'
          git add state artifacts data/manifest.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m '[quantos] atomic research delta'
          git pull --rebase origin main
          git push origin HEAD:main
