[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quantos-xauusd"
version = "0.5.1"
description = "Token-efficient repository-backed XAUUSD research loop"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
research = ["numpy>=1.26,<3", "pandas>=2.2,<3"]
dev = ["pytest>=8,<9"]

[tool.setuptools]
py-modules = ["quantos"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
